<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watch Video</title>
  <style>
    body { margin: 0; background-color: #0d0d0d; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
    .player-box { width: 90%; max-width: 900px; aspect-ratio: 16/9; background: #000; box-shadow: 0 10px 30px rgba(0,0,0,0.8); border-radius: 8px; overflow: hidden; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <div class="player-box">
    <iframe id="videoPlayer" src="" allowfullscreen></iframe>
  </div>

  <script>
    // 1. Map your custom link IDs to YouTube IDs
    const videoDatabase = {
      "15257806244421708159": "dQw4w9WgXcQ", // replace "dQw4w9WgXcQ" with your YouTube ID
      "sample-video-2": "another_youtube_id"
    };

    // 2. Read ID from URL query: yoursite.vercel.app/?id=15257806244421708159
    const urlParams = new URLSearchParams(window.location.search);
    const videoId = urlParams.get('id');

    const player = document.getElementById('videoPlayer');

    if (videoId && videoDatabase[videoId]) {
      const ytId = videoDatabase[videoId];
      player.src = `https://www.youtube-nocookie.com/embed/${ytId}?rel=0&autoplay=1`;
    } else {
      document.body.innerHTML = "<h2>Video Not Found or Invalid Link</h2>";
    }
  </script>
</body>
</html>
